name: Frozen publication tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock
      - run: make test
      - run: make verify
